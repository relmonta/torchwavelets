[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchwavelets"
description = "Torch-native successor to pytorch_wavelets: differentiable DWT (1D/2D), dual-tree complex wavelet transform (1D/2D/3D), DTCWT scattering, SWT and wavelet packets."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Rachid El Montassir" }]
keywords = ["wavelet", "dwt", "dtcwt", "pytorch", "deep-learning", "signal-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.23", "torch>=2.6", "PyWavelets>=1.4"]
dynamic = ["version"]

[project.optional-dependencies]
examples = ["matplotlib>=3.6", "scikit-learn>=1.2", "Pillow>=9.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "pymdown-extensions>=10.8"]
lightning = ["lightning>=2.0"]
dev = ["pre-commit>=3.6", "mypy>=1.10"]
test = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/relmonta/torchwavelets"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "torchwavelets._version.__version__" }

[tool.setuptools.package-data]
torchwavelets = ["py.typed"]
"torchwavelets.dtcwt.data" = ["*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "cuda: tests that require a CUDA device",
    "slow: long running tests",
]
filterwarnings = [
    "ignore:Level value of .* is too high:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
files = ["src/torchwavelets"]

[tool.coverage.run]
source = ["torchwavelets"]
omit = ["src/torchwavelets/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
